name: AxoGuard
version: 1.0
main: com.axoguard.anticheat.Main
api-version: 1.20

commands:
  axobot:
    description: AxoBot izleme sistemi
    permission: axoguard.admin
  report:
    description: Oyuncu şikayet etme komutu
  reports:
    description: Şikayet edilen oyuncuları listeleme
    permission: axoguard.admin
  banla:
    description: Süreli ban atma komutu
    permission: axoguard.admin
  banla-ip:
    description: IP ban atma komutu
    permission: axoguard.admin
  ban-ip:
    description: IP ban kaldırma komutu
    permission: axoguard.admin
  banaç:
    description: Oyuncunun banını açma komutu
    permission: axoguard.admin
  banaç-ip:
    description: IP adresinin banını açma komutu
    permission: axoguard.admin
  mutele:
    description: Süreli mute atma komutu
    permission: axoguard.admin
  muteaç:
    description: Mute kaldırma komutu
    permission: axoguard.admin
  bot:
    description: Steve görünümlü AxoBot spawn/kapa komutu
    permission: axoguard.admin
  bothava:
    description: Havada sabit duran koruma botu spawn/kapa komutu
    permission: axoguard.admin

